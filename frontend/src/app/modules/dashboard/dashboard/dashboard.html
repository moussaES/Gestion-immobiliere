<div class="dashboard-page">
  <div *ngIf="loading" class="loading">Chargement...</div>

  <div class="dashboard-grid-new" *ngIf="stats">
    
    <!-- Row 1 -->
    <app-stat-card 
      title="BIENS OCCUPÉS" 
      [value]="stats.biens_occupes" 
      badge="BO" 
      color="purple">
    </app-stat-card>
    
    <app-stat-card 
      title="BIENS LIBRES" 
      [value]="stats.biens_libres" 
      badge="BL" 
      color="cyan">
    </app-stat-card>
    
    <app-stat-card 
      title="TOTAL BIENS" 
      [value]="stats.total_biens" 
      badge="TB" 
      color="blue">
    </app-stat-card>

    <!-- Row 2 -->
    <app-stat-card 
      title="CONTRATS ACTIFS" 
      [value]="stats.contrats_actifs" 
      badge="CA" 
      color="red">
    </app-stat-card>
    
    <app-stat-card 
      title="PAIEMENTS EN ATTENTE (CE MOIS)" 
      [value]="stats.paiements_en_attente" 
      [isCurrency]="true"
      subtitle="Loyers attendus : {{ stats.loyers_attendus | number }} FCFA | Cumul impayés : {{ (stats.paiements_en_attente_global || stats.paiements_en_attente) | number }} FCFA"
      badge="PA" 
      color="orange">
    </app-stat-card>
    
    <app-stat-card 
      title="PROPRIÉTAIRES" 
      [value]="stats.total_proprietaires" 
      badge="PR" 
      color="pink">
    </app-stat-card>

    <!-- Row 3 -->
    <app-stat-card 
      title="LOCATAIRES" 
      [value]="stats.total_locataires" 
      badge="LO" 
      color="magenta">
    </app-stat-card>

    <app-stat-card 
      title="TAUX D'OCCUPATION" 
      [value]="stats.taux_occupation + '%'" 
      badge="%" 
      color="cyan">
    </app-stat-card>

    <app-stat-card 
      title="LOYERS COLLECTÉS (CE MOIS)" 
      [value]="stats.revenu_mensuel" 
      [isCurrency]="true"
      badge="REV" 
      color="green">
    </app-stat-card>

    <!-- Row 4 : Nouvelles cartes -->

    <app-stat-card *ngIf="isAdmin()"
      title="REVENU AGENCE (10%)" 
      [value]="stats.revenus_agence_encaisses" 
      [isCurrency]="true"
      subtitle="Attendu : {{ stats.revenus_agence_attendus | number }} FCFA"
      badge="BLL" 
      color="blue">
    </app-stat-card>

  </div>
</div>
